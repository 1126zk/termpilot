name: release

# 三平台打包，用 v*.*.* 标签触发。
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            goos: windows
          - os: macos-latest
            goos: darwin
          - os: ubuntu-latest
            goos: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: 校验版本号（tag 与 package.json 一致）
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./frontend/package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag 与 frontend/package.json 的 version $pkg 不一致"
            exit 1
          fi

      - name: 安装 Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: 安装 Linux webview 依赖
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: 前端依赖
        working-directory: frontend
        run: npm ci

      - name: 构建前准备（CLI + 图标）
        run: node scripts/prebuild.mjs ${{ matrix.goos }}

      - name: 构建
        run: wails build

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: termpilot-${{ matrix.goos }}
          path: |
            build/bin/*
          if-no-files-found: error
