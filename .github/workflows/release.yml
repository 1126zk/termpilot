name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # tag 与 package.json 的 version 必须一致，避免发错版
      - name: 校验版本号
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag 与 package.json 的 version $pkg 不一致"
            exit 1
          fi

      - name: 安装依赖
        run: npm ci

      - name: 编译 CLI
        run: npm run cli:build

      - name: 构建
        run: npx electron-vite build

      # electron-builder 默认创建草稿 Release，确认后再到 GitHub 手动发布
      - name: 打包并上传到 Release
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
