name: release

# 三平台打包，用 v*.*.* 标签触发。
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      # 一个平台挂了不连带取消其他平台，方便一次看清各自的结果
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
          - os: macos-latest
            goos: darwin
          - os: ubuntu-latest
            goos: linux
    runs-on: ${{ matrix.os }}
    env:
      # Monaco 等依赖让 vite 打包超过 Node 默认的约 2GB 堆，macOS runner 上会 OOM
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: 校验版本号（tag 与 package.json 一致）
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./frontend/package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag 与 frontend/package.json 的 version $pkg 不一致"
            exit 1
          fi

      - name: 安装 Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: 安装 Linux webview 依赖
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: 前端依赖
        working-directory: frontend
        run: npm ci

      - name: 构建前准备（CLI + 图标 + ConPTY）
        run: node scripts/prebuild.mjs ${{ matrix.goos }}

      - name: 构建
        shell: bash
        # Linux 装的是 webkit2gtk-4.1，Wails 默认链 4.0，要加这个 tag
        run: wails build ${{ matrix.goos == 'linux' && '-tags webkit2_41' || '' }}

      # macOS 产物是 .app 目录，Linux 可执行文件要保留 x 权限，都先打成压缩包再上传
      - name: 打包
        shell: bash
        run: |
          mkdir -p dist
          name="TermPilot-${GITHUB_REF_NAME}-${{ matrix.goos }}"
          case "${{ matrix.goos }}" in
            windows) 7z a "dist/$name.zip" ./build/bin/TermPilot.exe ;;
            darwin)  ditto -c -k --keepParent build/bin/TermPilot.app "dist/$name.zip" ;;
            linux)   tar -czf "dist/$name.tar.gz" -C build/bin TermPilot ;;
          esac
          ls -l dist

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: termpilot-${{ matrix.goos }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
